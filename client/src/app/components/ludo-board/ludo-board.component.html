<div class="game-container">
  <!-- Leave Room Button -->
  <button class="leave-room-btn" (click)="leaveRoom()" title="Leave Room">
    Leave Room
  </button>

  <div class="ludo-board">
    <!-- Board -->
    <div
      *ngFor="let cell of gridCells; let i = index"
      class="cell path"
      [style.grid-column]="(i % 15) + 1"
      [style.grid-row]="Math.floor(i / 15) + 1"
      [ngClass]="{
        'home-red': isRedHome(i),
        'home-yellow': isYellowHome(i),
        'home-green': isGreenHome(i),
        'home-blue': isBlueHome(i),

        'border-red': isRedBorder(i),
        'border-green': isGreenBorder(i),
        'border-blue': isBlueBorder(i),
        'border-yellow': isYellowBorder(i),

        'Base-All': isBaseAll(i),

        'red-path': isRedPath(i),
        'yellow-path': isYellowPath(i),
        'blue-path': isBluePath(i),
        'green-path': isGreenPath(i),

        'safe-zone': isSafeZone(i),
        'finish-zone': isFinishZone(i),
      }"
    ></div>

    <!-- Pieces -->
    @for (piece of pieces$ | async; track piece.id) {
      <div
        class="piece"
        [ngClass]="{
          red: piece.color === 'red',
          yellow: piece.color === 'yellow',
          blue: piece.color === 'blue',
          green: piece.color === 'green',
          movable:
            isMyPiece(piece) && gameState?.movablePieces?.includes(piece.id),
        }"
        [style.left.px]="piece.currentX + getPieceOffset(piece).x"
        [style.top.px]="piece.currentY + getPieceOffset(piece).y"
        [style.transform]="'scale(' + getPieceScale(piece) + ')'"
        (click)="selectPiece(piece.id)"
        (keyup.enter)="selectPiece(piece.id)"
        (keyup.space)="selectPiece(piece.id)"
        [attr.tabindex]="isMyPiece(piece) && gameState?.movablePieces?.includes(piece.id) ? 0 : -1"
        [attr.data-id]="piece.id"
        role="button"
      ></div>
    }
  </div>

  <!-- Dice -->
  <div
    class="dice-button"
    [ngClass]="{
      'Red-Turn': IsRedTurn(),
      'Blue-Turn': IsBlueTurn(),
      'Yellow-Turn': IsYellowTurn(),
      'Green-Turn': IsGreenTurn(),
    }"
  >
    <div class="turn-info text-bold-large">
      {{ getCurrentPlayerName() }}'s Turn
    </div>

    <!-- Dice -->
    <div
      class="dice-container"
      (click)="rollDice()"
      (keyup.enter)="rollDice()"
      (keyup.space)="rollDice()"
      [ngClass]="{
        disabled: !isMyTurn() || valueDice() > 1 || isGameWon(),
      }"
      [attr.tabindex]="!isMyTurn() || valueDice() > 1 || isGameWon() ? -1 : 0"
      role="button"
    >
      <div
        class="dice"
        [ngClass]="{ rolling: isRolling }"
        [attr.data-value]="valueDice()"
      >
        <!-- Face 1 -->
        <div class="face front">
          <span class="dot dot-center"></span>
        </div>

        <!-- Face 2 -->
        <div class="face back">
          <span class="dot"></span>
          <span class="dot dot-bottom-right"></span>
        </div>

        <!-- Face 3 -->
        <div class="face left">
          <span class="dot"></span>
          <span class="dot dot-center"></span>
          <span class="dot dot-bottom-right"></span>
        </div>

        <!-- Face 4 -->
        <div class="face right">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot dot-bottom-left"></span>
          <span class="dot dot-bottom-right"></span>
        </div>

        <!-- Face 5 -->
        <div class="face top">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot dot-center"></span>
          <span class="dot dot-bottom-left"></span>
          <span class="dot dot-bottom-right"></span>
        </div>

        <!-- Face 6 -->
        <div class="face bottom">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot dot-middle-left"></span>
          <span class="dot dot-middle-right"></span>
          <span class="dot dot-bottom-left"></span>
          <span class="dot dot-bottom-right"></span>
        </div>
      </div>
    </div>

    <!-- Dice Text -->
    <div class="dice-instruction text-size-14 text-weight-400">
      {{
        (gameState?.diceValue || 0) > 0
          ? 'Select a piece to move'
          : 'Click dice to roll'
      }}
    </div>

    <!-- Win Message -->
    @if (isGameWon()) {
      <div class="win-message text-size-24 text-weight-bold">
        {{ gameState?.gameWon }} WINS!!
      </div>
    }
  </div>
</div>
